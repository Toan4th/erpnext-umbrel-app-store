name: ERPNext
version: "15.0.5"
tagline: Free and open-source ERP for small and medium businesses
description: >-
  ERPNext is a comprehensive, open-source ERP built on the Frappe framework.
  It covers Accounting, CRM, Inventory, HR, Payroll, Manufacturing, and
  Project Management — all in one place. Perfect for businesses wanting a
  full-featured business management suite without subscription fees.

  Includes: Accounting & Finance, Sales & CRM, Purchasing, Inventory,
  HR & Payroll, Manufacturing, Project Management, Website & E-Commerce.

